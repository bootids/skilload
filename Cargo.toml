[workspace]
members = [
    "crates/skilload-core",
    "crates/skilload-cli",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
assert_cmd = "2.2.2"
base64 = "0.23.1"
clap = { version = "4.6.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
libc = "=0.2.189"
predicates = "3.1.4"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
unicode-normalization = "=0.1.23"
toml = { version = "1.1.4", default-features = false, features = ["parse", "display", "serde", "std"] }
