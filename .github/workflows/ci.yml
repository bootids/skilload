name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - run: mise install
      - run: mise exec -- rustup component add clippy rustfmt
      - run: mise exec -- cargo fmt --all --check
      - run: mise exec -- cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: mise exec -- cargo test --workspace --all-features --locked
